<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>Press Any Key to start</h2>
    <div class="btn-container">
       <div class="lineone">
         <div class="button green " type="btn" id="green">1</div>
        <div class="button teal" type="btn" id="teal">2</div>
       </div>
       <div class="linetwo">
         <div class="button lightgreen  " type="btn" id="lightgreen">3</div>
        <div class="button darkgrey " type="btn" id="darkgrey">4</div>
       </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
